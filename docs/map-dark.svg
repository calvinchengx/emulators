  <title id="title">The emulator family: 25 repositories</title>
  <desc id="desc">One data product definition and one set of vendor systems feed 7 cells. Each cell is a leaf paired with a platform, grouped under the engine emulator it targets. Four cross-cutting emulators run in every stack.</desc>
