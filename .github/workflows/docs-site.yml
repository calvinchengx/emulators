name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      # The landing page's numbers are generated from these two.
      - 'members.json'
      - 'scripts/site_data.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check, so a PR that breaks the docs
  # generator fails here rather than after merge. Build only: the deploy job
  # is skipped below.
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      - 'members.json'
      - 'scripts/site_data.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
#
# PR builds get their OWN group, per ref. They must not share the deploy group:
# GitHub keeps at most one PENDING run per concurrency group and cancels the
# older one when a newer arrives, so while runners are saturated a steady
# arrival of PR builds cancels the queued main-branch run over and over and the
# site never publishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter emulators-docs build

      # THE LANDING PAGE ABOVE, THE DOCUMENTATION BELOW, the same shape
      # data-agent-service and data-agent-voice already publish. The root is
      # site/index.html and Starlight is mounted at /docs/.
      #
      # The map is copied rather than committed twice: render_map.py owns it,
      # `--check` owns whether it is current, and the landing page embeds both
      # themes with <picture>.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          # llms.txt at the SITE root, which is where the convention says to
          # look. The domain root would cover all eleven sites at once and is
          # not available: it is served by a deployment last modified in April
          # 2012, Pages is not enabled on calvinchengx.github.io, and that
          # repository's Docusaurus config targets a different domain.
          cp site/llms.txt _site/llms.txt
          cp docs/map.svg docs/map-dark.svg _site/
          cp -R website/dist _site/docs
          ./scripts/site_data.py --out _site

      # EVERY SLOT ON THE LANDING PAGE IS FILLED, checked here rather than
      # discovered by a reader. The page ships em dashes and fills them from
      # site-data.json at load time, so a key the generator stopped emitting
      # would show as a dash on the published page and nowhere else.
      - name: Every number the landing page asks for exists
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          page = pathlib.Path("_site/index.html").read_text(encoding="utf-8")
          data = json.loads(pathlib.Path("_site/site-data.json").read_text(encoding="utf-8"))
          wanted = set(re.findall(r'data-d="(\w+)"', page))
          ev = set(re.findall(r'data-ev="(\w+)"', page))
          missing = sorted(wanted - data.keys())
          missing_ev = sorted(ev - set(data.get("evidence", {})))
          if missing or missing_ev:
              print(f"::error::the landing page asks for {missing + missing_ev} "
                    f"and site_data.py does not emit it; those slots would publish "
                    f"as em dashes")
              sys.exit(1)
          print(f"landing page: {len(wanted)} counts + {len(ev)} ledgers, all present")
          PY

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PRs get the build as a check only. Deploying from a PR ref would be
    # rejected by the github-pages environment regardless.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
