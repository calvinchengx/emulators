name: Family CI status

# Polls every member's Actions state and fails when something is red, so
# GitHub's own failure notifications do the alerting. There is no bespoke
# notifier to build or keep working.
#
# A pull model on one schedule beats pushing from 25 repos: one workflow to
# maintain instead of 25 kept in sync, and 30-minute freshness is well inside
# what a human acts on.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # `scripts/**`, not the seven scripts this job runs, listed one by one.
    # It triggered on `family_ci.py` alone, so an edit to render_tables.py,
    # render_map.py, check_ontology.py, check_registry.py, check_verbs.py or
    # render_evidence.py reached main with NO CHECKS REPORTED -- the generator
    # that writes the README was outside the gate that verifies the README.
    #
    # A glob over-triggers (site_data.py and mirror_images.py fire this job for
    # nothing) and that is the direction to err in: this job is one cheap
    # runner, and the alternative is a list that goes stale the next time
    # somebody adds a script. `check_workflow_paths.py` enforces the property
    # either way.
    paths:
      - 'members.json'
      - 'scripts/**'
      - '.github/workflows/family-ci.yml'

permissions:
  contents: read

# Never let two sweeps overlap, and drop the older one: a stale sweep has
# nothing to say that the newer one does not.
concurrency:
  group: family-ci
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep every member
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv is not on the runner by default, and the ontology gate below runs
      # under it. Without this the gate does not fail: the step errors with
      # `uv: command not found`, which is a red for the wrong reason and
      # teaches nobody anything about the registry.
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"

      # FAMILY_CI_TOKEN is optional. Without it the default token still reads
      # every public repo's runs over REST, and only the head-commit rollup
      # column is lost. A fine-grained PAT with actions:read + metadata:read
      # restores it.
      # The matrix tables in README.md and /docs are generated from
      # members.json. A hand edit to either that does not match the registry
      # fails here, which is the guard that hand-maintenance did not have.
      - name: Committed tables match the registry
        run: ./scripts/render_tables.py --check

      # The ontology in docs/09: closed value sets, the shape rules for each
      # tier, and pairs_with DERIVED from (engine, orchestrator) so an
      # unpaired cell is an error rather than a silence. Runs its own
      # self-test first, because a gate nobody has watched fail is a gate
      # nobody knows the direction of.
      - name: The ontology holds
        run: |
          uv run --no-project --with jsonschema ./scripts/check_ontology.py --self-test
          uv run --no-project --with jsonschema ./scripts/check_ontology.py

      # `bom` is the one field this repository cannot derive: what the BOM
      # certifies is azure-emulators' fact, not ours. Separated from the
      # structural check so a GitHub outage does not fail the shape rules.
      - name: BOM membership matches what azure-emulators stands up
        run: uv run --no-project --with jsonschema ./scripts/check_ontology.py --bom

      # `ports` is declared here and published in seven compose files. The
      # structural check above already refuses two members on one port; this
      # one refuses a declaration the platform's published compose does not
      # back, so the index a launcher reads cannot drift from what `up` maps.
      - name: Declared ports match each platform's published compose
        run: uv run --no-project --with jsonschema ./scripts/check_ontology.py --ports

      # The verb contract in docs/09: the Makefile floor per tier, read from
      # each member's published main. Self-test first, same reason as above.
      - name: Every member answers its tier's verb floor
        run: |
          ./scripts/check_verbs.py --self-test
          ./scripts/check_verbs.py

      # The launcher is the consumer of everything above: pairs, verbs and
      # ports. Its self-test covers resolution, the make line it builds and
      # the two-stack guard with injected `docker ps` output; `ls` proves it
      # reads the committed registry without a Docker daemon.
      - name: The launcher resolves every cell from the registry
        run: |
          ./family --self-test
          ./family ls

      # The map in README.md is generated from the same registry as the
      # tables. It was the last hand-drawn artefact here, and it showed seven
      # leaves as one node.
      - name: The committed map matches the registry
        run: ./scripts/render_map.py --check

      # llms.txt is generated from the registry too, so a member added to
      # members.json appears in it and a hand edit fails here.
      - name: The committed llms.txt matches the registry
        run: ./scripts/render_llms.py --check

      # The cross-site footer is generated from the registry too, so a site
      # added to members.json appears in every footer and a hand edit fails.
      - name: The landing page's family footer matches the registry
        run: ./scripts/render_footer.py --self emulators --check

      # A registry can be accurate and still incomplete, and this repo cannot
      # detect that by looking at itself: a member nobody added is simply
      # absent, and the front door renders perfectly without it. So ask GitHub.
      - name: The registry lists every ecosystem repo
        env:
          GH_TOKEN: ${{ secrets.FAMILY_CI_TOKEN || github.token }}
        run: ./scripts/check_registry.py

      # docs/05 quotes the family's evidence numbers, generated from
      # azure-emulators' family_parity.py.
      #
      # WARNS RATHER THAN FAILS, and the distinction is deliberate. The two
      # checks above are about THIS repo's internal consistency: a hand-edited
      # table or a missing registry entry is a mistake made here and fixable
      # here, so they block. This one goes stale when a SIBLING repo lands a
      # witness, which is other people's progress rather than a defect. It
      # failed three times in one day for exactly that reason, and a red that
      # nobody in this repo caused is a red people learn to skip past, which
      # costs more than the staleness does.
      #
      # The warning is not silence: it names the one command that fixes it, it
      # repeats on every scheduled sweep until someone runs it, and the numbers
      # on the page carry their own instruction to run the generator rather
      # than trust the snapshot.
      - name: The evidence table matches family_parity.py
        run: |
          if ! ./scripts/render_evidence.py --check; then
            echo "::warning title=Evidence table is stale::A sibling repo has \
            landed a witness since docs/05 was generated. Run \
            ./scripts/render_evidence.py and commit. Not a defect in this repo."
          fi

      # A path filter is only safe while it covers what the job runs. This one
      # did not, for six of its seven scripts.
      - name: No workflow is silent for a script it runs
        run: |
          ./scripts/check_workflow_paths.py --self-test
          ./scripts/check_workflow_paths.py

      # EVERY MEMBER'S WORKFLOWS PARSE, AND EVERY JOB IS SCOPED. Both halves
      # come from failures seen in one evening: duplicate keys left three of
      # arm-emulator's workflows and the BOM's own chain gate running NOTHING,
      # with no failing check to point at, and CodeQL had
      # `actions/missing-workflow-permissions` open on seven jobs across six
      # repos. `yaml.safe_load` sees neither -- it keeps the last duplicate --
      # so the loader in this script refuses one, as GitHub does.
      - name: Every member's workflows parse, and every job is scoped
        env:
          GH_TOKEN: ${{ secrets.FAMILY_CI_TOKEN || github.token }}
        run: |
          uv run --no-project --with pyyaml ./scripts/check_workflow_hygiene.py --self-test
          uv run --no-project --with pyyaml ./scripts/check_workflow_hygiene.py

      # A QUIET REPO'S GREEN GOES STALE, AND ONLY A QUIET ONE'S DOES.
      # `ci.yml` on push and pull_request alone re-proves itself on every
      # commit; it rots only when the commits stop. Four members drifted that
      # way and each was found by hand, one at a time, after the sweep below
      # flagged it at 14 days. This fires at 7, a week earlier, and names the
      # fix in the message.
      #
      # It gates on the DEFECT, not the proxy. "Every ci.yml must carry a
      # schedule" fails 23 of the 27 members that have one and would impose a
      # weekly run on repos that commit daily and have never been stale,
      # fabric-emulator's 47-job matrix included. That is a compute decision
      # wearing a hygiene rule's clothes.
      - name: No member's CI proof is ageing without a way to refresh it
        env:
          GH_TOKEN: ${{ secrets.FAMILY_CI_TOKEN || github.token }}
        run: |
          uv run --no-project --with pyyaml ./scripts/check_ci_proof_ages.py --self-test
          uv run --no-project --with pyyaml ./scripts/check_ci_proof_ages.py

      - name: Self-test the gate before trusting it
        env:
          GH_TOKEN: ${{ secrets.FAMILY_CI_TOKEN || github.token }}
        run: ./scripts/family_ci.py --self-test

      - name: Sweep
        id: sweep
        env:
          GH_TOKEN: ${{ secrets.FAMILY_CI_TOKEN || github.token }}
        run: |
          set -o pipefail
          ./scripts/family_ci.py --json --no-rollup-required > ci-status.json
          ./scripts/family_ci.py --no-rollup-required | tee summary.md
          {
            echo '### Family CI'
            echo
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: ci-status
          path: |
            ci-status.json
            summary.md

      # Last, so the report is always published even when it is bad news.
      - name: Fail if any member is red or misdeclared
        env:
          GH_TOKEN: ${{ secrets.FAMILY_CI_TOKEN || github.token }}
        run: ./scripts/family_ci.py --red-only --fail-on-red --no-rollup-required
